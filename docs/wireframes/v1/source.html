 #flex-black-preview .fx-sr {position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}
 @media(max-width:360px) {#flex-black-preview {padding:15px 0;}#flex-black-preview .fx-main {padding-left:17px;padding-right:17px;}#flex-black-preview .fx-brand {padding-left:17px;padding-right:17px;}#flex-black-preview .fx-hero-title {font-size:33px;}#flex-black-preview .fx-proto {font-size:9px;}#flex-black-preview .fx-set {gap:6px;}}
</style>
<script>
(() => {
  const root = document.getElementById('flex-black-preview');
  const screen = root.querySelector('#fx-screen');
  const nav = root.querySelector('.fx-nav');
  const announcement = root.querySelector('#fx-announcement');
  const defaultRest=90;
  const templates = {
    upper:{name:'Upper Body',sub:'อก · หลัง · ไหล่',minutes:45,exercises:[{name:'Bench Press',group:'อก',weight:40,reps:10},{name:'Lat Pulldown',group:'หลัง',weight:35,reps:12},{name:'Shoulder Press',group:'ไหล่',weight:15,reps:10}]},
    lower:{name:'Lower Body',sub:'ขา · สะโพก',minutes:45,exercises:[{name:'Squat',group:'ขา',weight:40,reps:10},{name:'Romanian Deadlift',group:'สะโพก',weight:35,reps:10},{name:'Leg Press',group:'ขา',weight:60,reps:12}]},
    full:{name:'Full Body',sub:'ทั่วร่างกาย',minutes:45,exercises:[{name:'Goblet Squat',group:'ขา',weight:16,reps:12},{name:'Dumbbell Row',group:'หลัง',weight:15,reps:12},{name:'Dumbbell Press',group:'อก',weight:12,reps:10}]}
  };
  const copy = value => JSON.parse(JSON.stringify(value));
  Object.values(templates).forEach(t=>t.exercises.forEach(e=>{e.catalogId=e.name.toLowerCase().replaceAll(' ','-');e.setCount=3;e.restSeconds=defaultRest;}));
  const catalog=Object.values(templates).flatMap(t=>t.exercises).filter((e,i,all)=>all.findIndex(other=>other.catalogId===e.catalogId)===i);
  catalog.push({catalogId:'push-up',name:'Push-up',group:'อก',weight:0,reps:12,setCount:3,restSeconds:60},{catalogId:'biceps-curl',name:'Biceps Curl',group:'แขน',weight:8,reps:12,setCount:3,restSeconds:60},{catalogId:'triceps-pushdown',name:'Triceps Pushdown',group:'แขน',weight:15,reps:12,setCount:3,restSeconds:60});
  catalog.push({catalogId:'pull-up',name:'Pull-up',group:'หลัง',weight:0,reps:8,setCount:3,restSeconds:90},{catalogId:'bodyweight-squat',name:'Bodyweight Squat',group:'ขา',weight:0,reps:15,setCount:3,restSeconds:60});
  catalog.forEach(e=>{e.supportsBodyweight=['push-up','pull-up','bodyweight-squat'].includes(e.catalogId);e.loadMode=e.supportsBodyweight?'bodyweight':'external';});
  const seedLog = (key,day) => ({id:'sample-'+day,day,name:templates[key].name,partial:false,exercises:templates[key].exercises.map(e=>({...e,sets:Array.from({length:3},()=>({weight:e.weight,reps:e.reps,done:true}))}))});
  const initial = {view:'programs',day:14,plans:{12:{key:'lower',time:'18:30'},14:{key:'upper',time:'18:30'},16:{key:'full',time:'18:30'}},logs:[seedLog('lower',12),seedLog('upper',10)],draft:null,exercise:0,detailId:null,form:false,editDay:null,justSaved:false,rest:null,undo:null,sound:true,presets:copy(templates),presetEditor:null,assignment:null,presetNotice:null};
  let state = copy(initial);
  let lastWrittenPrivate=null;
  let openSetId=null;
  let swipeGesture=null;
  let suppressSwipeClick=false;
  let audioContext=null;
  let setSequence=0;
  const setId=()=> 'set-'+Date.now()+'-'+(++setSequence);
  const usesWeight=e=>e.loadMode!=='bodyweight';
  const loadLabel=e=>e.loadMode==='bodyweight'?'น้ำหนักตัว':e.loadMode==='added'?'น้ำหนักตัว + น้ำหนักเพิ่ม':'ใช้น้ำหนัก';
  const weightLabel=e=>e.loadMode==='added'?'กก. เพิ่ม':'กก.';
  function normalizeTargets(e){
    const base=catalog.find(c=>c.catalogId===e.catalogId||c.name===e.name);
    e.catalogId??=base?.catalogId;e.loadMode??=base?.loadMode||'external';
    e.supportsBodyweight=Boolean(base?.supportsBodyweight);
    if(!Array.isArray(e.targets)||!e.targets.length)e.targets=Array.from({length:e.setCount??3},()=>({id:setId(),weight:e.weight??base?.weight??0,reps:e.reps??base?.reps??10}));
    e.targets.forEach(s=>{s.id??=setId();});e.setCount=e.targets.length;e.reps=e.targets[0].reps;e.weight=e.targets[0].weight;
    if(e.sets){e.sets.forEach(s=>{s.id??=setId();if(!usesWeight(e))s.weight=null;});}
    return e;
  }
  const escape = value => String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const icon = name => '<i data-lucide="'+name+'" aria-hidden="true"></i>';
  const button = (action,label,kind='fx-primary',extra='') => '<button type="button" class="'+kind+' cursor-interaction" data-action="'+action+'" '+extra+'>'+label+'</button>';
  const count = log => log.exercises.reduce((n,e)=>n+e.sets.filter(s=>s.done).length,0);
  const total = log => log.exercises.reduce((n,e)=>n+e.sets.length,0);
  const days = ['จ.','อ.','พ.','พฤ.','ศ.','ส.','อา.'];
  const dayName = day => ({12:'จันทร์',13:'อังคาร',14:'พุธ',15:'พฤหัสบดี',16:'ศุกร์',17:'เสาร์',18:'อาทิตย์'}[day]||'');
  const plannedSets=t=>t.exercises.reduce((n,e)=>n+(e.targets?.length??e.setCount??3),0);
  const planTemplate=p=>p?.snapshot||state.presets[p?.key]||templates.upper;
  const planCompleted=(day,plan)=>Boolean(plan&&state.logs.some(l=>l.day===day&&(l.planId?l.planId===plan.id:!plan.createdAt&&l.name===planTemplate(plan).name)));
  function packExercise(e){
    const index=catalog.findIndex(c=>c.catalogId===e.catalogId||c.name===e.name);
    if(index<0)return e;
    return [index,e.setCount??3,e.reps,e.restSeconds??defaultRest,e.sets?e.sets.map(s=>[s.id||null,s.weight,s.reps,s.done?1:0,s.restSeconds??null]):null,e.weight??catalog[index].weight,e.targets?e.targets.map(s=>[s.weight,s.reps]):null,e.loadMode||catalog[index].loadMode];
  }
  function unpackExercise(e){
    if(!Array.isArray(e))return e;
    const item={...copy(catalog[e[0]]),setCount:e[1],reps:e[2],restSeconds:e[3],weight:e[5],loadMode:e[7]||catalog[e[0]].loadMode};
    if(e[6])item.targets=e[6].map(s=>({weight:s[0],reps:s[1]}));
    if(e[4])item.sets=e[4].map(s=>({id:s[0],weight:s[1],reps:s[2],done:Boolean(s[3]),...(s[4]===null?{}:{restSeconds:s[4]})}));return item;
  }
  const packPreset=t=>({n:t.name,e:t.exercises.map(packExercise)});
  function unpackPreset(t){const exercises=t.e.map(unpackExercise);return {name:t.n,sub:[...new Set(exercises.map(e=>e.group))].join(' · '),exercises};}
  function storedState(){
    const compact=copy(state);
    compact.presets=Object.fromEntries(Object.entries(state.presets).map(([id,t])=>[id,packPreset(t)]));
    Object.values(compact.plans).forEach(p=>{p.snapshot=packPreset(p.snapshot);delete p.rests;});
    compact.logs.forEach(l=>{l.exercises=l.exercises.map(packExercise);});
    if(compact.draft)compact.draft.exercises=compact.draft.exercises.map(packExercise);
    if(compact.presetEditor)compact.presetEditor.exercises=compact.presetEditor.exercises.map(packExercise);
    if(compact.assignment)compact.assignment.snapshot=packPreset(compact.assignment.snapshot);
    return compact;
  }
  function loadedState(compact){
    const restored=copy(compact);
    restored.presets=Object.fromEntries(Object.entries(restored.presets).map(([id,t])=>[id,unpackPreset(t)]));
    Object.values(restored.plans).forEach(p=>{p.snapshot=unpackPreset(p.snapshot);});
    restored.logs.forEach(l=>{l.exercises=l.exercises.map(unpackExercise);});
    if(restored.draft)restored.draft.exercises=restored.draft.exercises.map(unpackExercise);
    if(restored.presetEditor)restored.presetEditor.exercises=restored.presetEditor.exercises.map(unpackExercise);
    if(restored.assignment)restored.assignment.snapshot=unpackPreset(restored.assignment.snapshot);
    return restored;
  }
  function persist() {
    if(window.openai?.setWidgetState){
      const privateContent={version:2,state:storedState()};lastWrittenPrivate=JSON.stringify(privateContent);
      window.openai.setWidgetState({modelContent:{prototype:'FLEX black wireframe',screen:state.view,selectedDay:state.day,completedSessions:state.logs.length,presetNames:Object.values(state.presets).map(p=>p.name),restStatus:state.rest?.status||'idle',restSeconds:state.draft?.exercises[state.exercise]?.restSeconds??null},privateContent}).catch(()=>{});
    }
  }
  function restore(saved) {
    if([1,2].includes(saved?.privateContent?.version) && saved.privateContent.state?.plans && Array.isArray(saved.privateContent.state.logs)) state={...copy(initial),...(saved.privateContent.version===2?loadedState(saved.privateContent.state):saved.privateContent.state)};
    state.presets??=copy(templates);
    Object.values(state.presets).forEach(t=>t.exercises.forEach(normalizeTargets));
    Object.entries(state.plans).forEach(([day,p])=>{p.id??='plan-seed-'+day;if(!p.snapshot){p.snapshot=copy(state.presets[p.key]||templates.upper);p.snapshot.exercises.forEach((e,i)=>{e.restSeconds=p.rests?.[i]??e.restSeconds??defaultRest;});}});
    Object.values(state.plans).forEach(p=>p.snapshot.exercises.forEach(normalizeTargets));
    if(state.form&&!state.assignment){const p=state.plans[state.editDay];state.assignment={key:p?.key||'upper',day:state.editDay||14,time:p?.time||'18:30',snapshot:copy(p?planTemplate(p):state.presets.upper)};}
    if(state.draft)state.draft.exercises.forEach((e,i)=>{e.restSeconds??=state.plans[state.draft.day]?.rests?.[i]??defaultRest;normalizeTargets(e);});
    state.logs.forEach(l=>l.exercises.forEach(normalizeTargets));
    if(state.presetEditor){state.presetEditor.exercises.forEach(normalizeTargets);state.presetEditor.activeExercise=Math.max(0,Math.min(state.presetEditor.activeExercise??0,state.presetEditor.exercises.length-1));state.presetEditor.undoTarget??=null;}
    if(state.assignment)state.assignment.snapshot.exercises.forEach(normalizeTargets);
    if(state.rest?.status==='running'&&state.rest.endAt<=Date.now())state.rest.status='done';
  }
  restore(window.openai?.widgetState);
  window.addEventListener('openai:set_globals',e=>{const saved=e.detail?.globals?.widgetState;if(saved&&JSON.stringify(saved.privateContent)!==lastWrittenPrivate){restore(saved);render();}});
  function head(title,subtitle,action='') {return '<div class="fx-page-head"><div><h1>'+title+'</h1><p class="fx-muted">'+subtitle+'</p></div>'+action+'</div>';}
  function setDescription(e,s){return usesWeight(e)?s.weight+' '+(e.loadMode==='added'?'กก. เพิ่ม':'กก.')+' × '+s.reps+' ครั้ง':s.reps+' ครั้ง · น้ำหนักตัว';}
  function targetLines(e){return '<div class="fx-target-lines">'+e.targets.map((s,i)=>'<p>เซต '+(i+1)+': '+setDescription(e,s)+'</p>').join('')+'</div>';}
  function exercises(t) {return t.exercises.map((e,i)=>'<div class="fx-exercise"><span class="fx-index">'+String(i+1).padStart(2,'0')+'</span><div><p class="fx-exercise-title">'+escape(e.name)+'</p><p class="fx-muted">'+escape(e.group)+' · '+e.targets.length+' เซต · '+loadLabel(e)+'</p>'+targetLines(e)+'<p class="fx-muted">พัก '+(e.restSeconds??defaultRest)+' วินาที / เซต</p></div><span class="fx-round fx-right">'+icon(usesWeight(e)?'dumbbell':'person-standing')+'</span></div>').join('');}
  function unlockAudio(){
    if(!state.sound)return;
    try{const Audio=window.AudioContext||window.webkitAudioContext;if(Audio&&!audioContext)audioContext=new Audio();if(audioContext?.state==='suspended')audioContext.resume().catch(()=>{});}catch{}
  }
  function playRestAlert(){
    if(!state.sound||!audioContext||audioContext.state!=='running')return;
    try{[0,.22,.44].forEach(offset=>{const start=audioContext.currentTime+offset;const oscillator=audioContext.createOscillator();const gain=audioContext.createGain();oscillator.type='sine';oscillator.frequency.value=880;gain.gain.setValueAtTime(0,start);gain.gain.linearRampToValueAtTime(.12,start+.015);gain.gain.exponentialRampToValueAtTime(.001,start+.16);oscillator.connect(gain);gain.connect(audioContext.destination);oscillator.start(start);oscillator.stop(start+.18);});}catch{}
  }
  const remaining=()=>state.rest?.status==='running'?Math.max(0,Math.ceil((state.rest.endAt-Date.now())/1000)):0;
  const clock=seconds=>String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0');
  function restPanel(){
    const rest=state.rest;if(!rest)return '';
    const done=rest.status==='done',left=remaining();
    return '<section class="fx-rest" id="fx-rest-panel" data-status="'+rest.status+'" aria-label="เวลาพักระหว่างเซต"><p class="fx-rest-heading">'+icon(done?'bell-ring':'timer')+(done?'พักครบแล้ว':'กำลังพักระหว่างเซต')+'</p><p class="fx-muted">'+escape(rest.exerciseName)+' · หลังเซต '+rest.setNumber+'</p><div class="fx-rest-main">'+(done?'<p role="status">พร้อมเริ่มเซตถัดไป</p>':'<span class="fx-rest-clock" role="timer" aria-label="เวลาพักที่เหลือ" aria-live="off">'+clock(left)+'</span>')+button('dismiss-rest',done?'รับทราบ':'ข้ามพัก','fx-secondary')+'</div>'+(done?'':'<div class="fx-rest-meter"><span style="width:'+(left/rest.seconds*100)+'%"></span></div>')+'</section>';
  }
  function startRest(exercise,set,index){
    state.rest=exercise.restSeconds>0?{status:'running',endAt:Date.now()+exercise.restSeconds*1000,seconds:exercise.restSeconds,exerciseName:exercise.name,setId:set.id,setNumber:index+1}:null;
    if(state.rest)announcement.textContent='เริ่มพัก '+exercise.restSeconds+' วินาที หลัง '+exercise.name+' เซต '+(index+1);
  }
  function refreshRest(){
    if(state.rest?.status!=='running')return;
    if(remaining()===0){state.rest.status='done';announcement.textContent='หมดเวลาพัก พร้อมเริ่มเซตถัดไป';playRestAlert();const panel=screen.querySelector('#fx-rest-panel');if(panel){panel.outerHTML=restPanel();if(globalThis.lucide)lucide.createIcons({attrs:{width:19,height:19}});}persist();}
    else{const display=screen.querySelector('.fx-rest-clock'),bar=screen.querySelector('.fx-rest-meter span');if(display)display.textContent=clock(remaining());if(bar)bar.style.width=(remaining()/state.rest.seconds*100)+'%';}
  }
  function today() {
    const plan=state.plans[14], t=plan?planTemplate(plan):null;
    const completed=planCompleted(14,plan);
    return head('วันนี้','พุธ 14 ต.ค. 2569', '<span class="fx-outline-icon" aria-hidden="true">'+icon('dumbbell')+'</span>')+
      (completed?'<div class="fx-done-banner">'+icon('check-circle-2')+'<div><p>บันทึกการฝึกวันนี้แล้ว</p><p class="fx-muted">ดูรายละเอียดได้ในประวัติ</p></div></div>':'')+
      (t?'<div class="fx-hero"><div class="fx-hero-top"><span class="fx-eyebrow">YOUR NEXT SESSION</span><span class="fx-tag">'+escape(plan.time)+'</span></div><div class="fx-hero-title">'+escape(t.name).toUpperCase().replace(' ','<br>')+'</div><p class="fx-muted">'+escape(t.sub)+'</p><div class="fx-facts"><div class="fx-fact"><strong>'+t.exercises.length+'</strong><span>ท่าฝึก</span></div><div class="fx-fact"><strong>'+plannedSets(t)+'</strong><span>เซตตามแผน</span></div></div>'+button('start',icon(state.draft?'play':'arrow-up-right')+(state.draft?'ฝึกต่อจากที่ค้างไว้':'เริ่มออกกำลังกาย'))+'</div><div class="fx-section"><h2>ท่าฝึกในโปรแกรม</h2>'+button('edit-today','เปลี่ยนโปรแกรม '+icon('arrow-right'),'fx-text-btn')+'</div>'+exercises(t):'<div class="fx-empty">'+icon('calendar-plus')+'<h2>วันนี้ยังไม่มีโปรแกรม</h2><p class="fx-muted">เลือกโปรแกรมสำหรับการฝึกครั้งถัดไป</p>'+button('edit-today','เลือกโปรแกรม')+'</div>');
  }
  function schedule() {
    const plan=state.plans[state.day], t=plan?planTemplate(plan):null;
    const isDone=planCompleted(state.day,plan);
    return head('ตารางฝึก','วางแผน แล้วทำให้เป็นกิจวัตร')+'<div class="fx-line-head"><h2>ตุลาคม 2569</h2><span class="fx-muted">12–18 ต.ค.</span></div><div class="fx-week">'+days.map((name,i)=>'<button type="button" class="fx-day cursor-interaction" data-day="'+(i+12)+'" data-today="'+(i+12===14)+'" aria-pressed="'+(state.day===i+12)+'" aria-label="'+name+' '+(i+12)+' ตุลาคม"><span>'+name+'</span><b>'+(i+12)+'</b><i style="'+(state.plans[i+12]?'':'visibility:hidden')+'"></i></button>').join('')+'</div><div class="fx-section"><h2>'+dayName(state.day)+' '+state.day+' ต.ค.</h2>'+button('add-plan',icon(plan?'pencil':'plus')+(plan?'แก้ไข':'เพิ่ม'),'fx-text-btn')+'</div>'+
      (t?'<div class="fx-plan"><span class="fx-time">'+escape(plan.time)+'</span><div class="fx-plan-box"><span class="fx-tag">'+(isDone?'ฝึกแล้ว':'ตามแผน')+'</span><h2 class="fx-summary-name">'+escape(t.name)+'</h2><p class="fx-muted">'+escape(t.sub)+'</p><p class="fx-muted">'+t.exercises.length+' ท่า · '+plannedSets(t)+' เซต</p>'+button('plan-detail','ดูท่าฝึก '+icon('arrow-right'),'fx-secondary')+'</div></div>':'<div class="fx-empty">'+icon('calendar-plus')+'<h2>วันว่างของคุณ</h2><p class="fx-muted">เลือกโปรแกรมที่บันทึกไว้ลงตาราง</p>'+button('add-plan',icon('plus')+'เลือกโปรแกรม')+'</div>')+'<p class="fx-note">'+icon('circle-dot')+'จุดใต้วันที่แสดงวันที่มีโปรแกรมฝึก</p>';
  }
  function planDetail() {
    const p=state.plans[state.day],t=planTemplate(p);
    return button('back-schedule',icon('arrow-left')+'กลับไปตาราง','fx-back')+head(escape(t.name),dayName(state.day)+' '+state.day+' ต.ค. · '+escape(p.time))+exercises(t)+'<div class="fx-workout-actions">'+(state.day===14?button('start',icon('play')+'เริ่มออกกำลังกาย'):'')+button('add-plan',icon('calendar-days')+'แก้ไขตาราง','fx-secondary')+'</div>';
  }
  function openAssignment(day,key=null){
    const plan=state.plans[day],selected=key||plan?.key||Object.keys(state.presets)[0];
    state.editDay=day;state.assignment={key:selected,day,time:plan?.time||'18:30',snapshot:copy(key?state.presets[key]:plan?planTemplate(plan):state.presets[selected])};state.form=true;
  }
  function form() {
    const a=state.assignment;
    return button('cancel-form',icon('arrow-left')+'ย้อนกลับ','fx-back')+head('ลงตารางฝึก','เลือก Preset แล้วกำหนดวันและเวลา')+'<form class="fx-form" id="fx-plan-form"><label>โปรแกรมที่บันทึกไว้<select name="program" aria-label="โปรแกรมฝึก">'+Object.entries(state.presets).map(([key,t])=>'<option value="'+escape(key)+'" '+(a.key===key?'selected':'')+'>'+escape(t.name)+'</option>').join('')+'</select></label><label>วันฝึก<select name="plan-day" aria-label="วันฝึก">'+days.map((d,i)=>'<option value="'+(i+12)+'" '+(a.day===i+12?'selected':'')+'>'+dayName(i+12)+' '+(i+12)+' ต.ค. 2569</option>').join('')+'</select></label><label>เวลา<input type="time" name="time" aria-label="เวลาฝึก" value="'+escape(a.time)+'" required></label><div id="fx-assignment-summary">'+assignmentSummary(a.snapshot)+'</div><p class="fx-rest-hint">ใช้ค่าเซต จำนวนครั้ง และเวลาพักจาก Preset นี้</p><div id="fx-plan-warning" class="fx-error" role="status">'+replacementNote(a)+'</div><div class="fx-form-actions">'+button('cancel-form','ยกเลิก','fx-secondary')+'<button type="button" class="fx-primary cursor-interaction" data-action="save-plan">บันทึกตาราง</button></div></form>';
  }
  function replacementNote(a){return state.plans[a.day]?'วันที่เลือกมีโปรแกรมอยู่แล้ว การบันทึกจะแทนที่รายการเดิม':'';}
  function assignmentSummary(t){return '<div class="fx-form-summary">'+t.exercises.map(e=>'<div class="fx-summary-name"><p>'+escape(e.name)+'</p>'+targetLines(e)+'<p class="fx-muted">พัก '+e.restSeconds+' วินาที / เซต</p></div>').join('')+'</div>';}
  function programs(){

  function render() {
    swipeGesture=null;
    screen.innerHTML=(state.view!=='workout'||state.form?restPanel():'')+(state.form?form():({today,schedule,programs,workout,history,detail,'plan-detail':planDetail,'preset-editor':editor,'exercise-picker':exercisePicker}[state.view]||today)());

    nav.style.display=nav.hidden?'none':'grid';
    nav.querySelectorAll('[data-nav]').forEach(b=>{const selected=b.dataset.nav===(state.view==='detail'?'history':state.view==='plan-detail'?'schedule':state.view);if(selected)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});

  function settleSwipe(row,revealed){
    row.classList.remove('is-dragging');
    row.classList.toggle('is-open',revealed);
    row.querySelector('.fx-swipe-front').style.removeProperty('transform');
    row.querySelector('.fx-delete').hidden=!revealed;
    row.querySelector('[data-reveal]').setAttribute('aria-expanded',String(revealed));
  }
  function revealSwipe(row,revealed){
    screen.querySelectorAll('.fx-swipe').forEach(other=>settleSwipe(other,other===row&&revealed));
    openSetId=row&&revealed?row.dataset.swipe:null;
  }
  root.addEventListener('pointerdown',event=>{
    if(!event.isPrimary||event.button!==0)return;
    const row=event.target.closest('.fx-swipe');
    if(!row){revealSwipe(null,false);return;}
    if(event.target.closest('.fx-delete'))return;
    const initialOpen=openSetId===row.dataset.swipe;
    swipeGesture={row,pointerId:event.pointerId,x:event.clientX,y:event.clientY,initialOpen,offset:initialOpen?-86:0,dragging:false};
  });
  root.addEventListener('pointermove',event=>{
    const g=swipeGesture;if(!g||event.pointerId!==g.pointerId)return;
    const dx=event.clientX-g.x,dy=event.clientY-g.y;
    if(!g.dragging){
      if(Math.max(Math.abs(dx),Math.abs(dy))<8)return;
      if(Math.abs(dy)>Math.abs(dx)){swipeGesture=null;return;}
      if(Math.abs(dx)<Math.abs(dy)*1.2)return;
      g.dragging=true;
      screen.querySelectorAll('.fx-swipe').forEach(other=>{if(other!==g.row)settleSwipe(other,false);});
      g.row.classList.add('is-dragging');
      try{g.row.setPointerCapture(event.pointerId);}catch{}
    }
    if(event.cancelable)event.preventDefault();
    g.offset=Math.max(-86,Math.min(0,(g.initialOpen?-86:0)+dx));
    g.row.querySelector('.fx-swipe-front').style.transform='translateX('+g.offset+'px)';
    g.row.querySelector('.fx-delete').hidden=g.offset===0;
  },{passive:false});
  function finishSwipe(event,cancelled){
    const g=swipeGesture;if(!g||g.pointerId!==event.pointerId)return;
    swipeGesture=null;
    if(!g.dragging)return;
    revealSwipe(g.row,cancelled?g.initialOpen:g.offset<=-30);
    if(g.row.hasPointerCapture(event.pointerId))g.row.releasePointerCapture(event.pointerId);
    suppressSwipeClick=true;
    setTimeout(()=>{suppressSwipeClick=false;},400);
  }
  root.addEventListener('pointerup',event=>finishSwipe(event,false));
  root.addEventListener('pointercancel',event=>finishSwipe(event,true));
  root.addEventListener('click',event=>{
    if(suppressSwipeClick&&event.target.closest('.fx-swipe')){suppressSwipeClick=false;event.preventDefault();event.stopImmediatePropagation();return;}
    if(openSetId&&!event.target.closest('.fx-delete,[data-reveal]'))revealSwipe(null,false);
  },true);
  root.addEventListener('click',event=>{
    const b=event.target.closest('button');if(!b||b.disabled)return;
    const d=b.dataset;
    if(d.reveal!==undefined){const row=b.closest('.fx-swipe');revealSwipe(row,openSetId!==row.dataset.swipe);return;}
    if(d.nav){state.view=d.nav;state.form=false;state.justSaved=false;}
    else if(d.editPreset){openPresetEditor(d.editPreset);}
    else if(d.schedulePreset){openAssignment(state.day,d.schedulePreset);}
    else if(d.addExercise){
      if(!state.presetEditor||state.presetEditor.exercises.length>=8)return;
      const exercise=catalog.find(e=>e.catalogId===d.addExercise);
      if(!exercise||state.presetEditor.exercises.some(e=>e.catalogId===exercise.catalogId))return;
      state.presetEditor.exercises.push(normalizeTargets(copy(exercise)));state.presetEditor.activeExercise=state.presetEditor.exercises.length-1;state.presetEditor.undoTarget=null;state.view='preset-editor';
    }
    else if(d.removeExercise!==undefined){state.presetEditor.exercises.splice(Number(d.removeExercise),1);state.presetEditor.activeExercise=Math.max(0,Math.min(state.presetEditor.activeExercise,state.presetEditor.exercises.length-1));state.presetEditor.undoTarget=null;}
    else if(d.editorExercise!==undefined){state.presetEditor.activeExercise=Number(d.editorExercise);}
    else if(d.deleteTarget!==undefined){
      const editor=state.presetEditor,e=editor.exercises[editor.activeExercise],index=Number(d.deleteTarget);if(e.targets.length<=1)return;
      openSetId=null;editor.undoTarget={catalogId:e.catalogId,index,target:e.targets.splice(index,1)[0]};e.setCount=e.targets.length;announcement.textContent='ลบเซต '+(index+1)+' แล้ว กดเลิกทำเพื่อคืนเซต';
    }
    else if(d.day){state.day=Number(d.day);}
    else if(d.exercise){state.exercise=Number(d.exercise);}
    else if(d.log){state.detailId=d.log;state.view='detail';state.justSaved=false;}
    else if(d.check!==undefined){
      const i=Number(d.check),exercise=state.draft.exercises[state.exercise],set=exercise.sets[i];
      if(!set.done){const inputs=[...screen.querySelectorAll('input[data-set="'+i+'"]'),screen.querySelector('#fx-rest-seconds')];if(inputs.some(input=>!input.reportValidity()||input.value==='')){root.querySelector('#fx-validation').textContent='ตรวจข้อมูลของเซตและเวลาพักก่อนทำเครื่องหมาย';return;}unlockAudio();}
      set.done=!set.done;
      if(set.done){set.restSeconds=exercise.restSeconds;startRest(exercise,set,i);}
      else if(state.rest?.setId===set.id)state.rest=null;
    }
    else if(d.delete!==undefined){
      const e=state.draft.exercises[state.exercise],index=Number(d.delete);if(e.sets.length<=1)return;
      openSetId=null;
      const removed=e.sets.splice(index,1)[0];state.undo={exercise:state.exercise,index,set:removed,session:state.draft.id};
      if(state.rest?.setId===removed.id)state.rest=null;
      else if(state.rest?.exerciseName===e.name)state.rest.setNumber=e.sets.findIndex(s=>s.id===state.rest.setId)+1;
      announcement.textContent='ลบเซต '+(index+1)+' แล้ว กดเลิกทำเพื่อคืนเซต';
    }
    else switch(d.action){
      case 'new-preset':openPresetEditor();break;
      case 'back-programs':state.view='programs';break;
      case 'choose-exercise':state.view='exercise-picker';break;
      case 'back-editor':state.view='preset-editor';break;
      case 'save-preset':if(!savePreset())return;break;
      case 'add-target':{
        const editor=state.presetEditor,e=editor.exercises[editor.activeExercise],last=e.targets[e.targets.length-1];if(e.targets.length<8){e.targets.push({id:setId(),weight:last.weight,reps:last.reps});e.setCount=e.targets.length;}break;
      }
      case 'undo-target':{
        const editor=state.presetEditor,undo=editor.undoTarget;if(!undo)return;
        const index=editor.exercises.findIndex(e=>e.catalogId===undo.catalogId);if(index<0)return;
        const e=editor.exercises[index];if(e.targets.length>=8){announcement.textContent='คืนเซตไม่ได้ ขณะนี้มีครบ 8 เซตแล้ว';return;}
        e.targets.splice(undo.index,0,undo.target);e.setCount=e.targets.length;editor.activeExercise=index;editor.undoTarget=null;announcement.textContent='คืนเซตที่ลบแล้ว';break;
      }
      case 'edit-today':openAssignment(14);break;
      case 'add-plan':openAssignment(state.day);break;
      case 'cancel-form':state.form=false;state.assignment=null;break;
      case 'save-plan':{if(!savePlan())return;break;}
      case 'dismiss-rest':state.rest=null;break;
      case 'undo-delete':{
        const undo=state.undo;if(!undo||undo.session!==state.draft?.id)return;
        const exercise=state.draft.exercises[undo.exercise];
        if(exercise.sets.length>=8){announcement.textContent='คืนเซตไม่ได้ ขณะนี้มีครบ 8 เซตแล้ว';return;}
        exercise.sets.splice(undo.index,0,undo.set);state.exercise=undo.exercise;
        if(state.rest?.exerciseName===exercise.name)state.rest.setNumber=exercise.sets.findIndex(s=>s.id===state.rest.setId)+1;
        state.undo=null;announcement.textContent='คืนเซตที่ลบแล้ว';break;
      }
      case 'plan-detail': state.view='plan-detail';break;
      case 'back-schedule': state.view='schedule';break;
      case 'back-history': state.view='history';break;
      case 'start': {
        if(!state.draft){const plan=state.plans[14],t=planTemplate(plan);state.draft={id:'session-'+Date.now(),planId:plan.id,day:14,name:t.name,partial:false,exercises:t.exercises.map(e=>({...copy(e),restSeconds:e.restSeconds??defaultRest,sets:e.targets.map(target=>({id:setId(),weight:usesWeight(e)?target.weight:null,reps:target.reps,done:false}))}))};state.exercise=0;state.rest=null;state.undo=null;}
        state.view='workout';break;
      }
      case 'leave-workout':state.view='today';announcement.textContent='พักการฝึกไว้แล้ว กดฝึกต่อจากที่ค้างไว้เพื่อกลับมา';break;
      case 'add-set':{const e=state.draft.exercises[state.exercise],last=e.sets[e.sets.length-1];if(e.sets.length<8)e.sets.push({id:setId(),weight:usesWeight(e)?last.weight:null,reps:last.reps,done:false});break;}
      case 'next-exercise':state.exercise=Math.min(state.draft.exercises.length-1,state.exercise+1);break;
      case 'finish':{
        if(!count(state.draft))return;
        const log=copy(state.draft);log.partial=count(log)!==total(log);state.logs.unshift(log);state.draft=null;state.rest=null;state.undo=null;state.view='history';state.justSaved=true;announcement.textContent='บันทึกการฝึก '+count(log)+' เซตเรียบร้อย';break;
      }
      default:return;
    }
    render();persist();
  });
  root.addEventListener('input',event=>{
    const input=event.target;
    if(input.id==='fx-preset-name'&&state.presetEditor){state.presetEditor.name=input.value;persist();}
    if(input.dataset.targetField&&state.presetEditor){const e=state.presetEditor.exercises[state.presetEditor.activeExercise];e.targets[Number(input.dataset.targetSet)][input.dataset.targetField]=input.value===''?'':Number(input.value);persist();}
    if(input.id==='fx-preset-rest'&&state.presetEditor){state.presetEditor.exercises[state.presetEditor.activeExercise].restSeconds=input.value===''?'':Number(input.value);persist();}
    if(input.name==='time'&&state.assignment){state.assignment.time=input.value;persist();}
    if(input.matches('[data-field]')&&state.draft){state.draft.exercises[state.exercise].sets[Number(input.dataset.set)][input.dataset.field]=input.value===''?'':Number(input.value);persist();}
    if(input.id==='fx-rest-seconds'&&state.draft&&input.value!==''&&input.validity.valid){state.draft.exercises[state.exercise].restSeconds=Number(input.value);persist();}
  });
  root.addEventListener('change',event=>{
    const input=event.target;
    if(input.id==='fx-preset-load-mode'&&state.presetEditor){state.presetEditor.exercises[state.presetEditor.activeExercise].loadMode=input.value;render();persist();}
    if(input.id==='fx-sound'){state.sound=input.checked;if(state.sound)unlockAudio();persist();}
    if(input.name==='program'&&state.assignment){state.assignment.key=input.value;state.assignment.snapshot=copy(state.presets[input.value]);screen.querySelector('#fx-assignment-summary').innerHTML=assignmentSummary(state.assignment.snapshot);persist();}
    if(input.name==='plan-day'&&state.assignment){state.assignment.day=Number(input.value);screen.querySelector('#fx-plan-warning').textContent=replacementNote(state.assignment);persist();}
  });
  function savePlan(){
    const form=screen.querySelector('#fx-plan-form');if(!form||!form.reportValidity())return false;
    const fields=new FormData(form),day=Number(fields.get('plan-day'));
    state.plans[day]={id:'plan-'+Date.now(),createdAt:Date.now(),key:fields.get('program'),time:fields.get('time'),snapshot:copy(state.assignment.snapshot)};state.day=day;state.form=false;state.assignment=null;state.view='schedule';announcement.textContent='บันทึกโปรแกรมวันที่ '+state.day+' ตุลาคมแล้ว';return true;
  }
  root.addEventListener('keydown',event=>{
    if(event.key==='Enter'&&event.target.closest('#fx-plan-form')){event.preventDefault();if(savePlan()){render();persist();}}
    if(event.key==='Enter'&&event.target.closest('#fx-preset-form')){event.preventDefault();if(savePreset()){render();persist();}}
    if(event.target.matches('[data-reveal]')&&['ArrowLeft','ArrowRight','Escape'].includes(event.key)){event.preventDefault();revealSwipe(event.target.closest('.fx-swipe'),event.key==='ArrowLeft');}
    else if(event.key==='Escape'&&openSetId){revealSwipe(null,false);}
  });
  render();
  const ticker=setInterval(()=>{if(!root.isConnected){clearInterval(ticker);if(audioContext)audioContext.close().catch(()=>{});return;}refreshRest();},250);
  if(globalThis.Tweak){
    const design={radius:12,surface:'#171717'};
    const phone=root.querySelector('.fx-phone');
    const tweak=new Tweak({container:phone,onChange:()=>{phone.style.setProperty('--fx-radius',design.radius+'px');phone.style.setProperty('--fx-panel',design.surface);}});
    tweak.addSlider(design,'radius',{label:'ความโค้งมุม',min:4,max:20,step:2,unit:'px'});
    tweak.addColorPicker(design,'surface',{label:'สีพื้นการ์ด',reference:'--fx-panel'});
  }
})();
</script>
